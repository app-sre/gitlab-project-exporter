[project]
name = "gitlab-project-exporter"
version = "0.2.0"
description = "Gitlab Project Prometheus exporter"
authors = [{ name = "Red Hat App-SRE Team", email = "sd-app-sre@redhat.com" }]
license = { text = "Apache 2.0" }
requires-python = "~= 3.14.0"
dependencies = [
    "fastapi==0.141.1",
    "python-gitlab==8.5.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "prometheus-client==0.26.0",
    "uvicorn==0.52.1",
]

[project.urls]
homepage = "https://github.com/app-sre/gitlab-project-exporter"
repository = "https://github.com/app-sre/gitlab-project-exporter"
documentation = "https://github.com/app-sre/gitlab-project-exporter"

[dependency-groups]
dev = [
    "mypy==2.3.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-mock==3.15.1",
    "responses==0.26.2",
    "ruff==0.16.2",
    "uvicorn[standard]==0.52.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
only-include = ["gitlab_project_exporter"]

[tool.hatch.build.targets.wheel]
only-include = ["gitlab_project_exporter"]

# Ruff configuration
[tool.ruff]
line-length = 88
src = ["gitlab_project_exporter", "tests"]
extend-exclude = [".local", ".cache", "tmp"]
fix = true

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = [
    "CPY",                               # Missing copyright header
    "undocumented-public-module",        # Missing docstring in public module
    "undocumented-public-class",         # Missing docstring in public class
    "undocumented-public-method",        # Missing docstring in public method
    "undocumented-public-function",      # Missing docstring in public function
    "undocumented-public-package",       # Missing docstring in public package
    "undocumented-public-init",          # Missing docstring in __init__
    "incorrect-blank-line-before-class", # 1 blank line required before class docstring
    "blank-line-before-class",           # No blank lines allowed before class docstring
    "multi-line-summary-first-line",     # multi-line-summary-first-line
    "multi-line-summary-second-line",    # multi-line-summary-second-line
    "D4",                                # Doc string style
    "line-too-long",                     # Line too long
    "too-many-public-methods",           # Too many public methods
    "too-many-arguments",                # Too many arguments
    "too-many-positional-arguments",     # Too many positional arguments
    "assert",                            # Use of assert detected. Pytest uses assert
    "suspicious-subprocess-import",      # subprocess import
    "try-consider-else",                 # try-consider-else
    # pydoclint
    "DOC",
    # May conflict with the formatter, https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
    "tab-indentation",
    "indentation-with-invalid-multiple",
    "indentation-with-invalid-multiple-comment",
    "over-indented",
    "docstring-tab-indentation",
    "triple-single-quotes",
    "Q",
    "missing-trailing-comma",
    "prohibited-trailing-comma",
    "single-line-implicit-string-concatenation",
]
[tool.ruff.format]
preview = true

[tool.ruff.lint.isort]
known-first-party = ["gitlab_project_exporter"]

# Mypy configuration
[tool.mypy]
files = ["gitlab_project_exporter", "tests"]
enable_error_code = ["truthy-bool", "redundant-expr"]
no_implicit_optional = true
check_untyped_defs = true
warn_unused_ignores = true
show_error_codes = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

# Coverage configuration
[tool.coverage.run]
branch = true
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 85
